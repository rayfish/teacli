name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build binaries
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            goos=${target%/*}
            goarch=${target#*/}
            out="dist/teacli-${goos}-${goarch}"
            [ "$goos" = windows ] && out="${out}.exe"
            GOOS="$goos" GOARCH="$goarch" go build -o "$out" -ldflags="-s -w" .
          done
          chmod +x dist/teacli-linux-* dist/teacli-darwin-*

      # install.sh and `teacli update` both parse this file and refuse to
      # install an asset that has no entry in it, so the names must stay bare.
      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > ../checksums.txt

      - name: Verify the tag matches the compiled version
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          built=$(./dist/teacli-linux-amd64 --version | awk '{print $NF}')
          if [ "$tag" != "$built" ]; then
            echo "tag v$tag does not match the built version $built (cmd/root.go)" >&2
            exit 1
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*
            checksums.txt
